<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Historial - Autos Colombia</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<div class="layout">

    <div th:replace="~{fragmentos :: menu('historial')}"></div>

    <main class="contenido">
        <h1>Historial de entradas y salidas</h1>
        <p class="descripcion">Consulta los movimientos registrados en el parqueadero</p>

        <form th:action="@{/admin/historial}" method="get" class="filtros-historial">
            <div>
                <label for="placa">Placa</label>
                <input type="text" id="placa" name="placa" class="campo-form" placeholder="ABC123"
                       maxlength="6" autocomplete="off" style="text-transform: uppercase"
                       th:value="${placa}">
            </div>
            <div>
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" class="campo-form"
                       placeholder="Nombre del usuario" autocomplete="off"
                       th:value="${usuario}">
            </div>
            <div>
                <label for="desde">Desde</label>
                <input type="date" id="desde" name="desde" class="campo-form" th:value="${desde}">
            </div>
            <div>
                <label for="hasta">Hasta</label>
                <input type="date" id="hasta" name="hasta" class="campo-form"
                       th:value="${hasta}" th:attr="min=${desde}">
            </div>
            <button type="submit" class="boton-buscar">Buscar</button>
            <a class="boton-limpiar" th:href="@{/admin/historial}">Limpiar</a>
        </form>

        <div th:if="${error}" class="mensaje error" th:text="${error}"></div>

        <section class="tabla-panel">
            <p th:if="${#lists.isEmpty(filas) and error == null}" style="padding: 16px 10px;">
                No hay movimientos para los filtros aplicados.
            </p>

            <table class="tabla" th:unless="${#lists.isEmpty(filas)}">
                <thead>
                    <tr>
                        <th>Placa</th>
                        <th>Usuario</th>
                        <th>Celda</th>
                        <th>Entrada</th>
                        <th>Salida</th>
                        <th>Tiempo permanencia</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="f : ${filas}">
                        <td th:text="${f.placa()}"></td>
                        <td th:text="${f.usuario()}"></td>
                        <td th:text="${f.celda()}"></td>
                        <td th:text="${f.entrada()}"></td>
                        <td th:text="${f.salida()}"></td>
                        <td th:text="${f.permanencia()}"></td>
                        <td>
                            <span class="etiqueta-estado"
                                  th:classappend="${f.dentro()} ? 'dentro' : 'finalizado'"
                                  th:text="${f.dentro()} ? 'Dentro' : 'Finalizado'"></span>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="paginacion" th:if="${totalPaginas > 1}">
                <span th:text="'Total: ' + ${total} + ' movimientos'"></span>
                <nav>
                    <a th:if="${paginaActual > 1}"
                       th:href="@{/admin/historial(placa=${placa},usuario=${usuario},desde=${desde},hasta=${hasta},pagina=${paginaActual - 1})}">‹</a>
                    <a th:each="p : ${#numbers.sequence(1, totalPaginas)}"
                       th:href="@{/admin/historial(placa=${placa},usuario=${usuario},desde=${desde},hasta=${hasta},pagina=${p})}"
                       th:text="${p}"
                       th:classappend="${p == paginaActual} ? 'actual'"></a>
                    <a th:if="${paginaActual < totalPaginas}"
                       th:href="@{/admin/historial(placa=${placa},usuario=${usuario},desde=${desde},hasta=${hasta},pagina=${paginaActual + 1})}">›</a>
                </nav>
            </div>
        </section>
    </main>

</div>

<script>
    const desde = document.getElementById('desde');
    const hasta = document.getElementById('hasta');
    desde.addEventListener('change', () => { hasta.min = desde.value; });
</script>
</body>
</html>
